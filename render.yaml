# Render Blueprint - deploys the API and its Postgres database in a single
# "New Blueprint Instance" run.
#
# Docs: https://render.com/docs/blueprint-spec
#
# Render's Blueprint spec has no "one-off job" service type, and one-off jobs
# on a Docker web service reuse that service's own build (our last Dockerfile
# stage, `api`, which is distroless and has no goose binary or shell) - so
# migrations can't run as a Render-managed job on the free plan. Run them
# from your machine against the database's *external* connection string
# (Dashboard -> stripe-payment-db -> Connections -> External) instead, before
# the first deploy and after every deploy that adds a migration:
#
#   GOOSE_DRIVER=postgres GOOSE_DBSTRING="<external connection string>" \
#     goose -dir migrations up

databases:
  - name: stripe-payment-db
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------------
  # API - HTTP gateway
  # ---------------------------------------------------------------------------
  - type: web
    name: stripe-payment-api
    runtime: docker
    plan: free
    dockerfilePath: ./deployments/docker/Dockerfile
    dockerContext: .
    # No dockerCommand/target field exists in the Blueprint spec; Render
    # builds the Dockerfile's last stage by default, which is `api`.
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTP_PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: SHUTDOWN_TIMEOUT
        value: 15s

      - key: DATABASE_URL
        fromDatabase:
          name: stripe-payment-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      # --- Fill these in manually in the Render dashboard after deploy ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        sync: false
      - key: STRIPE_CHECKOUT_CANCEL_URL
        sync: false
      - key: STRIPE_CHECKOUT_RETURN_URL
        sync: false
      - key: STRIPE_PORTAL_RETURN_URL
        sync: false
